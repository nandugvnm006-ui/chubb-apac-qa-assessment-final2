<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assessment Demo — Sign in</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f5f8; color: #182230; }
    main { width: min(92vw, 390px); box-sizing: border-box; padding: 2rem; background: white; border: 1px solid #d8dee8; border-radius: 14px; box-shadow: 0 10px 35px #1b2a4112; }
    h1 { margin-top: 0; font-size: 1.6rem; }
    p { color: #526071; line-height: 1.45; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; padding: .75rem; margin-top: .35rem; border: 1px solid #9aa7b8; border-radius: 7px; font: inherit; }
    button { width: 100%; padding: .8rem; margin-top: 1.25rem; border: 0; border-radius: 7px; background: #174ea6; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid #94bfff; outline-offset: 2px; }
    [role="alert"] { color: #a11b1b; min-height: 1.3em; }
    .hint { font-size: .82rem; }
  </style>
</head>
<body>
  <main>
    <h1>Sign in</h1>
    <p>Use the local demo account to open the sample claims page.</p>
    <form id="login-form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p id="login-message" role="alert" aria-live="polite"></p>
      <button type="submit">Log in</button>
    </form>
    <p class="hint">Demo credentials are documented in .env.example. Do not use real credentials.</p>
  </main>
  <script>
    const form = document.querySelector('#login-form');
    const message = document.querySelector('#login-message');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = '';
      const data = new FormData(form);
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: data.get('email'), password: data.get('password') })
        });
        const result = await response.json();
        if (!response.ok) {
          message.textContent = result.message || 'Unable to sign in.';
          return;
        }
        window.location.assign('/claims');
      } catch {
        message.textContent = 'Unable to connect. Please try again.';
      }
    });
  </script>
</body>
</html>
